<title>Nexlyn Microsite Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17181b; --ink-soft:#55565b; --paper:#f2f1ec; --line:#dedcd3;
  --graphite:#a7a499; --indigo:#3538cd; --chrome:#141416; --chrome-2:#1e1e21;
  --chrome-line:#2c2c30; --chrome-text:#e8e6df; --chrome-dim:#8b8880;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--chrome); color:var(--chrome-text);
  font-family:"Inter",system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}

/* ---------- top chrome ---------- */
.bar{
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:11px 18px; background:var(--chrome);
  border-bottom:1px solid var(--chrome-line); flex:0 0 auto;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;letter-spacing:-.01em}
.brand svg{width:17px;height:17px;display:block}
.pill{
  font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.09em;
  text-transform:uppercase; color:#9aa3e8; border:1px solid #343a72;
  background:#1b1d38; border-radius:3px; padding:3px 8px; white-space:nowrap;
}
.tabs{display:flex;gap:2px;margin-left:auto;background:var(--chrome-2);border-radius:6px;padding:3px}
.tab{
  appearance:none;border:0;background:transparent;color:var(--chrome-dim);
  font:inherit;font-size:13px;padding:6px 14px;border-radius:4px;cursor:pointer;
  transition:background .15s,color .15s;
}
.tab:hover{color:var(--chrome-text)}
.tab[aria-current="page"]{background:var(--indigo);color:#fff}
.devs{display:flex;gap:2px;background:var(--chrome-2);border-radius:6px;padding:3px}
.dev{
  appearance:none;border:0;background:transparent;color:var(--chrome-dim);
  padding:6px 9px;border-radius:4px;cursor:pointer;display:grid;place-items:center;
  transition:background .15s,color .15s;
}
.dev:hover{color:var(--chrome-text)}
.dev[aria-pressed="true"]{background:#33343a;color:#fff}
.dev svg{width:15px;height:15px;display:block}
.tab:focus-visible,.dev:focus-visible{outline:2px solid #7f8bdd;outline-offset:2px}

/* ---------- url strip ---------- */
.urlbar{
  display:flex;align-items:center;gap:10px;padding:7px 18px;
  background:var(--chrome-2);border-bottom:1px solid var(--chrome-line);flex:0 0 auto;
}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:#3a3a3f;display:block}
.url{
  font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--chrome-dim);
  background:#101012;border:1px solid var(--chrome-line);border-radius:4px;
  padding:4px 11px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.url b{color:var(--chrome-text);font-weight:400}
.size{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:#5f5d58;white-space:nowrap}

/* ---------- stage ---------- */
.stage{
  flex:1 1 auto;min-height:0;overflow:auto;
  display:flex;justify-content:center;align-items:flex-start;
  padding:0;background:#0d0d0f;
}
.stage[data-dev="desktop"]{padding:0}
.stage[data-dev="tablet"],.stage[data-dev="mobile"]{padding:22px 16px}
.frame{
  border:0;width:100%;height:100%;display:block;background:var(--paper);
}
.stage[data-dev="tablet"] .frame{
  width:834px;max-width:100%;height:calc(100% - 44px);
  border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.5);
}
.stage[data-dev="mobile"] .frame{
  width:390px;max-width:100%;height:calc(100% - 44px);
  border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.5);
}

/* ---------- launch note ---------- */
.note{
  flex:0 0 auto;background:#1b1608;border-top:1px solid #3d3418;padding:9px 18px;
  font-size:12px;color:#d8c98d;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;
}
.note b{color:#f0e4b4;font-weight:600}
.note code{font-family:"JetBrains Mono",monospace;font-size:11px;color:#f0e4b4}

@media (max-width:760px){
  .bar{gap:10px;padding:9px 12px}
  .tabs{margin-left:0;order:3;width:100%;justify-content:space-between}
  .tab{flex:1;padding:7px 6px;font-size:12px}
  .devs{margin-left:auto}
  .urlbar{padding:6px 12px}
  .dots{display:none}
  .note{font-size:11px;padding:8px 12px}
}
</style>

<div class="bar">
  <span class="brand">
    <svg viewBox="0 0 140 140" aria-hidden="true">
      <mask id="m"><rect width="140" height="140" fill="#fff"/><circle cx="110" cy="30" r="13.5" fill="#000"/></mask>
      <rect x="30" y="30" width="80" height="80" rx="10" fill="#5c5fe0" mask="url(#m)"/>
      <circle cx="110" cy="30" r="9" fill="none" stroke="#5c5fe0" stroke-width="3"/>
    </svg>
    Nexlyn
  </span>
  <span class="pill">Internal preview</span>

  <div class="devs" role="group" aria-label="Preview width">
    <button class="dev" data-dev="desktop" aria-pressed="true" title="Desktop" aria-label="Desktop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="4" width="20" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>
    </button>
    <button class="dev" data-dev="tablet" aria-pressed="false" title="Tablet" aria-label="Tablet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M11 18.5h2"/></svg>
    </button>
    <button class="dev" data-dev="mobile" aria-pressed="false" title="Mobile" aria-label="Mobile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18.5h2"/></svg>
    </button>
  </div>

  <div class="tabs" role="tablist" aria-label="Pages">
    <button class="tab" role="tab" data-page="home" aria-current="page">Home</button>
    <button class="tab" role="tab" data-page="services">Services</button>
    <button class="tab" role="tab" data-page="contact">Contact</button>
    <button class="tab" role="tab" data-page="legal">Legal</button>
  </div>
</div>

<div class="urlbar">
  <span class="dots"><i></i><i></i><i></i></span>
  <span class="url">nexlyn.ai<b id="url-path">/</b></span>
  <span class="size" id="size">1440 × auto</span>
</div>

<div class="stage" data-dev="desktop" id="stage">
  <iframe class="frame" id="frame" title="Nexlyn microsite preview"></iframe>
</div>

<div class="note">
  <b>Not final:</b>
  <span>legal entity fields are unfilled placeholders, and <code>hello@nexlyn.ai</code> is a stand-in — both are pending real values before launch.</span>
</div>

const PAGES = [{"key":"home","label":"Home","path":"/"},{"key":"services","label":"Services","path":"/services"},{"key":"contact","label":"Contact","path":"/contact"},{"key":"legal","label":"Legal","path":"/legal"}];
const FONTS = "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin><link href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">";

const frame = document.getElementById("frame");
const stage = document.getElementById("stage");
const urlPath = document.getElementById("url-path");
const sizeEl = document.getElementById("size");

// Rewrites the site's real routes onto postMessage hops, so clicking a link
// inside the preview switches pages instead of trying to hit a live server.
const ROUTES = { "/": "home", "/services": "services", "/contact": "contact", "/legal": "legal" };

function buildDoc(key) {
  return "<!doctype html><html><head><meta charset='utf-8'>"
    + "<meta name='viewport' content='width=device-width,initial-scale=1'>"
    + FONTS
    + "<style>" + CSS + "</style></head><body>" + DOCS[key]

const INNER = `
// The site's own scripts are stripped from this static build, so the scroll
// reveals are replayed here — otherwise the preview would show the no-JS
// fallback (everything visible, no motion) and the team could not review it.
document.documentElement.classList.add("js");
(function () {
  var els = document.querySelectorAll(".nx-reveal, .nx-sweep, .nx-step");
  if (!("IntersectionObserver" in window) ||
      window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    for (var i = 0; i < els.length; i++) els[i].classList.add("is-in");
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      en.target.classList.add("is-in");
      io.unobserve(en.target);
    });
  }, { rootMargin: "0px 0px -8% 0px", threshold: 0 });
  for (var j = 0; j < els.length; j++) {
    var r = els[j].getBoundingClientRect();
    if (r.top < innerHeight && r.bottom > 0) els[j].classList.add("is-in");
    else io.observe(els[j]);
  }
})();

document.addEventListener("click", function (e) {
  var a = e.target.closest && e.target.closest("a");
  if (!a) return;
  var href = a.getAttribute("href") || "";
  if (href.charAt(0) === "#") return;               // in-page anchor: let it run
  if (/^(mailto:|tel:)/.test(href)) return;          // real mail links still work
  e.preventDefault();
  var clean = href.split("#")[0].replace(/\\/$/, "") || "/";
  parent.postMessage({ nexlynGo: clean, hash: (href.split("#")[1] || "") }, "*");

let current = null;

function show(key, hash) {
  if (!DOCS[key]) key = "home";
  current = key;
  frame.srcdoc = buildDoc(key);
  const page = PAGES.find((p) => p.key === key);

for (const t of document.querySelectorAll(".tab")) {

}

for (const d of document.querySelectorAll(".dev")) {

window.addEventListener("message", (e) => {
  const d = e.data;
  if (d && d.nexlynGo) show(ROUTES[d.nexlynGo] || "home", d.hash);

function reportSize() {
  requestAnimationFrame(() => {
    sizeEl.textContent = Math.round(frame.getBoundingClientRect().width) + " × auto";
  });
}
window.addEventListener("resize", reportSize);

window.addEventListener("hashchange", () => {
  const key = location.hash.slice(1);
  if (key && key !== current) show(key);
});

show(location.hash.slice(1) || "home");
reportSize();
